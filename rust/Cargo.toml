[workspace]
members = ["apps/lmm-api-rs", "crates/application", "crates/contracts", "crates/domain", "crates/observability"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
http = "1.3.1"
redis = { version = "0.32.4", features = ["tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.17.0", features = ["v4"] }

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
