<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>LMM API</title>
    <meta name="title" content="LMM API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#020817" />
    <script>
      ;(() => {
        const match = document.cookie.match(
          /(?:^|;\s*)vite-ui-theme=(dark|light|system)(?:;|$)/
        )
        const savedTheme = match?.[1]
        const theme =
          savedTheme === 'light' ||
          (savedTheme === 'system' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'light'
            : 'dark'
        document.documentElement.classList.add(theme)
        document
          .querySelector("meta[name='theme-color']")
          ?.setAttribute('content', theme === 'dark' ? '#020817' : '#fff')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
