[package]
name = "lmm-api-rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[workspace]
members = ["crates/application", "crates/contracts", "crates/domain", "crates/lmm-db-migrate", "crates/observability"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
bcrypt = "0.19.2"
base64 = "0.22.1"
blake3 = "1.8.2"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.42", features = ["derive"] }
fallible-iterator = "0.2.0"
form_urlencoded = "1.2.2"
http = "1.3.1"
httpdate = "1.0.3"
hmac = "0.12.1"
hex = "0.4.3"
ipnet = "2.11.0"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
rand = "0.9.2"
redis = { version = "0.32.4", features = ["tokio-comp"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
postgres = { version = "0.19.10", features = ["with-serde_json-1"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
secrecy = { version = "0.10.3", features = ["serde"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0.12"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
totp-rs = "5.7.2"
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.17.0", features = ["v4"] }

[dependencies]
async-trait.workspace = true
axum.workspace = true
bcrypt.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
hex.workspace = true
form_urlencoded.workspace = true
http.workspace = true
httpdate.workspace = true
ipnet.workspace = true
jsonwebtoken.workspace = true
lmm-application = { path = "crates/application" }
lmm-contracts = { path = "crates/contracts" }
lmm-domain = { path = "crates/domain" }
lmm-observability = { path = "crates/observability" }
redis.workspace = true
rand.workspace = true
reqwest.workspace = true
rsa = { version = "0.9.10", features = ["pem"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
totp-rs.workspace = true
tower = { version = "0.5.2", features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
