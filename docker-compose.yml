services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmm_api}
      POSTGRES_USER: ${POSTGRES_USER:-lmm_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lmm-api]

  valkey:
    image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$${VALKEY_PASSWORD}\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    networks: [lmm-api]

  lmm-api-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: lmm-api-go:${LMM_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${LMM_API_BIND_ADDRESS:-127.0.0.1}:${LMM_API_PORT:-3000}:3000"
    environment:
      SQL_DSN: ${SQL_DSN:?set a PostgreSQL SQL_DSN in .env}
      REDIS_CONN_STRING: ${VALKEY_URL:?set the Valkey URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?set CRYPTO_SECRET in .env}
      GIN_MODE: release
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - go_data:/var/lib/lmm-api
    networks: [lmm-api]

  lmm-api-rs-preview:
    profiles: [rust-preview]
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        LMM_BUILD_REVISION: ${LMM_BUILD_REVISION:-development}
    image: lmm-api-rs-preview:${LMM_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${LMM_RS_PREVIEW_BIND_ADDRESS:-127.0.0.1}:${LMM_RS_PREVIEW_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${LMM_RS_PREVIEW_DATABASE_URL:-}
      VALKEY_URL: ${LMM_RS_PREVIEW_VALKEY_URL:-}
      LMM_DATABASE_SCHEMA: ${LMM_RS_PREVIEW_SCHEMA:-lmm_preview_v1}
      LMM_SCHEMA_CONTRACT: ${LMM_RS_PREVIEW_SCHEMA_CONTRACT:-1}
      LMM_RS_LISTEN_ADDR: 0.0.0.0:3000
      LMM_RS_SLOT: preview
      TZ: ${TZ:-Asia/Shanghai}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$LMM_DATABASE_SCHEMA" in
          lmm_preview_*) ;;
          *) echo "Rust preview requires an lmm_preview_* schema" >&2; exit 78 ;;
        esac
        test -n "$$DATABASE_URL" || { echo "LMM_RS_PREVIEW_DATABASE_URL is required" >&2; exit 78; }
        test -n "$$VALKEY_URL" || { echo "LMM_RS_PREVIEW_VALKEY_URL is required" >&2; exit 78; }
        exec /usr/local/bin/lmm-api-rs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [lmm-api]

volumes:
  postgres_data:
  valkey_data:
  go_data:

networks:
  lmm-api:
    driver: bridge
