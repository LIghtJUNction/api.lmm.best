name: LMM API Feature Request
description: Suggest a feature or improvement appropriate for this maintained fork
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        LMM API is a maintained fork of [New API](https://github.com/QuantumNous/new-api). Explain why this request belongs in this repository and how it relates to upstream behavior.

        Search this repository and [upstream Issues](https://github.com/QuantumNous/new-api/issues), then review the [project README](https://github.com/LIghtJUNction/api.lmm.best#readme) and [upstream docs](https://docs.newapi.pro/) before submitting.

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched this repository's [Issues](https://github.com/LIghtJUNction/api.lmm.best/issues) and found no duplicate request.
          required: true
        - label: I checked upstream New API documentation and Issues and confirmed the existing functionality does not meet this need.
          required: true
        - label: I explained why this feature should be implemented or maintained by the LMM API fork.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the real use case, current limitation, and affected users rather than only naming a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected user experience, API, or behavior and include concrete examples.
    validations:
      required: true

  - type: textarea
    id: fork-rationale
    attributes:
      label: Relationship to upstream New API
      description: State whether upstream has a related feature or issue and why this belongs in LMM API.
      placeholder: |
        Related upstream docs or issue:
        Current upstream behavior:
        Why LMM API should implement this:
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and why they are insufficient.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, protocol references, compatibility constraints, or implementation ideas. Do not include secrets.
    validations:
      required: false
