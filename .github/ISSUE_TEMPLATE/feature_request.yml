name: LMM API 功能建议
description: 建议适合由本衍生版本维护的新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认

        LMM API 是 [New API](https://github.com/QuantumNous/new-api) 的衍生版本。请说明该需求为何适合在本仓库实现，以及它与上游功能的关系。

        提交前请搜索本仓库和[上游仓库](https://github.com/QuantumNous/new-api/issues)，并查看[项目 README](https://github.com/LIghtJUNction/api.lmm.best#readme)与[上游文档](https://docs.newapi.pro/)。

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索本仓库的 [Issues](https://github.com/LIghtJUNction/api.lmm.best/issues)，确认没有重复建议。
          required: true
        - label: 我已检查上游 New API 的文档与 Issues，确认现有功能不能满足此需求。
          required: true
        - label: 我已说明此功能为何应由 LMM API 衍生版实现或维护。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述实际使用场景、当前限制和受影响的用户，不要只给出解决方案名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的用户体验、接口或行为，并给出具体示例。
    validations:
      required: true

  - type: textarea
    id: fork-rationale
    attributes:
      label: 与上游 New API 的关系
      description: 说明上游是否已有相关功能/Issue，以及为何应在 LMM API 中实现。
      placeholder: |
        上游相关文档或 Issue：
        上游当前行为：
        适合由 LMM API 实现的原因：
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明目前的临时方案，以及为何不足。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附界面草图、协议资料、兼容性要求或实现建议；请勿包含敏感信息。
    validations:
      required: false
