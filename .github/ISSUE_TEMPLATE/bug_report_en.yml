name: LMM API Bug Report
description: Report a bug reproducible in this repository or a regression from upstream New API
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        LMM API is a maintained fork of [New API](https://github.com/QuantumNous/new-api). This repository handles issues reproducible in **LMM API** and regressions introduced by this fork.

        - Usage and deployment: [project README](https://github.com/LIghtJUNction/api.lmm.best#readme)
        - Upstream documentation: [New API docs](https://docs.newapi.pro/)
        - If the issue also occurs in an unmodified upstream New API build, search or report it in [upstream Issues](https://github.com/QuantumNous/new-api/issues).
        - For third-party hosted services, private forks, or upstream provider failures, contact the relevant maintainer or provider.
        - Remove API keys, cookies, tokens, passwords, DSNs, and all other secrets before posting.

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched this repository's [Issues](https://github.com/LIghtJUNction/api.lmm.best/issues) and found no duplicate.
          required: true
        - label: I reproduced the issue with unmodified code from this repository; it is not limited to a third-party service or my private changes.
          required: true
        - label: I removed API keys, cookies, tokens, passwords, DSNs, and other sensitive data from requests, logs, and screenshots.
          required: true

  - type: input
    id: fork-version
    attributes:
      label: LMM API version
      description: Enter an exact commit SHA, release, or image tag. Do not use `latest` or `unknown`.
      placeholder: "For example: a1b2c3d or v1.2.3"
    validations:
      required: true

  - type: dropdown
    id: deployment-method
    attributes:
      label: Deployment method
      options:
        - Built from this repository
        - Container image built from this repository
        - Local development environment
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: upstream-reproduction
    attributes:
      label: Upstream New API comparison
      description: When possible, compare this fork and upstream using the same configuration and request.
      options:
        - Reproduces only in LMM API
        - Also reproduces in upstream New API
        - Not applicable (LMM API-specific feature)
        - Not compared yet (explain why below)
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe the actual behavior, impact, and frequency.
      placeholder: |
        What happened:
        Affected functionality or users:
        Always or intermittently:
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal, complete, repeatable steps. Include a redacted request for API issues.
      placeholder: |
        1. Configure ...
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected behavior
      description: Describe the correct behavior and the basis for that expectation.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, database, browser/client, and the relevant channel and model when applicable.
      placeholder: |
        OS and architecture:
        Database:
        Browser or client:
        Channel, model, and request protocol:
    validations:
      required: true

  - type: textarea
    id: upstream-comparison
    attributes:
      label: Upstream comparison details
      description: State the upstream version and comparison result. If not compared, explain why.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or minimal reproduction
      description: Add redacted server logs, response bodies, browser Console/Network output, or a minimal reproduction repository.
    validations:
      required: false
