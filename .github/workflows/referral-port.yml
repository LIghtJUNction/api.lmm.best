name: Referral upstream verification
on:
  push:
    branches: [codex/referral-first-topup-upstream]
    paths: ['.github/workflows/referral-port.yml']
permissions:
  contents: read
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Apply only the reviewed referral changes
        run: |
          git fetch origin 4c217923d62579334010871da45fec6d23a0e32e f422e6d19c1090f5f59bd89986f68316eaaa4d73
          git diff 4c217923d62579334010871da45fec6d23a0e32e f422e6d19c1090f5f59bd89986f68316eaaa4d73 -- apps docs > /tmp/referral.patch
          git apply --3way /tmp/referral.patch
          git diff --cached --name-only > /tmp/referral-changed.txt
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Regenerate contracts and normalize changed files
        run: |
          (cd apps/api-go && go run ./cmd/assistant-contracts -root .)
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = set(Path('/tmp/referral-changed.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in changed:
              if path not in allowed:
                  subprocess.run(['git', 'restore', '--worktree', '--', path], check=True)
          PY
      - name: Commit isolated upstream implementation
        id: commit
        run: |
          git add -- apps docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: reward first paid referrals and claw back confirmed abuse'
          git push origin HEAD:codex/referral-first-topup-upstream
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export source for verification or conflict repair
        if: always()
        run: |
          git status --short > /tmp/referral-port-status.txt
          tar --exclude=.git --exclude=node_modules --exclude='*/node_modules' --exclude='*/dist' -czf /tmp/referral-upstream-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: referral-upstream-source
          path: |
            /tmp/referral-upstream-source.tar.gz
            /tmp/referral-port-status.txt
          retention-days: 1
  go:
    needs: port
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.port.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Payment and referral regression
        working-directory: apps/api-go
        run: |
          go test -p 2 ./model ./controller ./router -count=1
          go test -p 2 ./model -run '^TestReferralConcurrentDistinctOrdersHaveOneWinner$' -count=20
          go vet ./model ./controller ./router
  web:
    needs: port
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.port.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Frontend static checks
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: Referral wallet and route regression
        run: |
          (cd apps/web && bun test --preload ./scripts/test-preload.mjs src/features/wallet/components/affiliate-rewards-card.test.tsx)
          bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh
      - name: Production build
        run: bun run --filter @lmm/web build
      - name: Full frontend regression
        run: bun run --filter @lmm/web test
