name: Electron embedded backend retirement guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-guard:
    name: Verify retired packages remain absent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify retired Electron packages are absent
        run: |
          test ! -e electron
          test ! -e apps/api-go/electron
