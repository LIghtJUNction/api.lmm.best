name: Electron embedded backend retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-guard:
    name: Verify packaging remains fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Verify retired Electron package cannot build
        working-directory: electron
        run: |
          npm ci --ignore-scripts
          node --check main.js
          bash -n build.sh
          test -x build.sh
          if ./build.sh; then
            echo "::error::Retired Electron direct build unexpectedly succeeded"
            exit 1
          fi
          if npm run build; then
            echo "::error::Retired Electron packaging unexpectedly succeeded"
            exit 1
          fi
