name: Referral implementation workbench
on:
  push:
    branches: [codex/referral-first-topup-clawback]
    paths:
      - '.github/workflows/referral-workbench.yml'
      - '.github/referral-implementation.ready'
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/referral-first-topup-clawback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Apply reviewed patch with integrity check
        id: patch
        run: |
          if [ -f .github/referral-implementation.ready ]; then
            cat .github/referral-implementation-*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/referral-implementation.patch
            expected=$(tr -d '\n' < .github/referral-implementation.ready)
            actual=$(sha256sum /tmp/referral-implementation.patch | cut -d' ' -f1)
            test "$expected" = "$actual"
            git apply --check /tmp/referral-implementation.patch
            git apply --index /tmp/referral-implementation.patch
            git diff --cached --name-only > /tmp/referral-changed.txt
            git rm .github/referral-implementation-*.b64 .github/referral-implementation.ready
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.patch.outputs.applied == 'true'
        with:
          bun-version: '1.3.14'
      - name: Install and format frontend changes
        if: steps.patch.outputs.applied == 'true'
        run: |
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = set(Path('/tmp/referral-changed.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in changed:
              if path not in allowed:
                  subprocess.run(['git', 'restore', '--worktree', '--', path], check=True)
          PY
      - name: Commit implementation on the feature branch
        id: commit
        run: |
          if [ -f /tmp/referral-changed.txt ]; then
            git add -- apps docs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git diff --cached --check
            git commit -m 'feat: implement first-paid-topup referral rewards and abuse clawbacks'
            git push origin HEAD:codex/referral-first-topup-clawback
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact source snapshot
        run: git archive --format=tar.gz -o /tmp/referral-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: referral-source
          path: /tmp/referral-source.tar.gz
          retention-days: 1
  go:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Referral and payment regression tests
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller ./router -count=1
      - name: Repeated concurrent referral regression
        working-directory: apps/api-go
        run: go test -p 2 ./model -run '^TestReferralConcurrentDistinctOrdersHaveOneWinner$' -count=20
      - name: Static analysis and formatting
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l model/referral*.go controller/referral*.go)"
          go vet ./model ./controller ./router
  web:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Frontend static checks
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: Frontend tests
        run: bun run --filter @lmm/web test
      - name: Frontend production build
        run: bun run --filter @lmm/web build
