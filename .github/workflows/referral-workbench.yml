name: Referral verification
on:
  push:
    branches: [codex/referral-first-topup-clawback]
    paths: ['.github/workflows/referral-workbench.yml']
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Referral and payment regression tests
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller ./router -count=1
      - name: Repeated concurrent referral regression
        working-directory: apps/api-go
        run: go test -p 2 ./model -run '^TestReferralConcurrentDistinctOrdersHaveOneWinner$' -count=20
      - name: Static analysis and formatting
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l model/referral*.go controller/referral*.go)"
          go vet ./model ./controller ./router
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Frontend static checks
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: Referral wallet regression
        working-directory: apps/web
        run: bun test --preload ./scripts/test-preload.mjs src/features/wallet/components/affiliate-rewards-card.test.tsx
      - name: Frontend route manifest regression
        run: bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh
      - name: Frontend production build
        run: bun run --filter @lmm/web build
