name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  web:
    name: Web checks, route manifest, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and copyright headers
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Test web workspace
        run: bun run --filter @lmm/web test

      - name: Validate frontend API route manifest
        run: bash apps/api-rust/behavior-oracle/tests/test-frontend-api-route-manifest.sh

      - name: Build production web assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: bun run --filter @lmm/web build

      - name: Upload web assets for the Go embed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web-dist
          path: apps/web/dist
          if-no-files-found: error

  go:
    name: Go default backend, relaykit, and static build
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Download verified web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-dist
          path: apps/api-go/web/dist

      - name: Test default Go module
        working-directory: apps/api-go
        run: go test ./...

      - name: Test and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go test ./...
          go build ./...

      - name: Build static Go production binary
        working-directory: apps/api-go
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/lmm-api .
          file out/lmm-api
          if ldd out/lmm-api 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Go production binary is dynamically linked' >&2
            exit 1
          fi

  rust-preview:
    name: Rust preview health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install route coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose

      - name: Report route ownership and parity without gating Go production
        continue-on-error: true
        run: |
          bash apps/api-rust/scripts/check-go-route-manifest.sh
          echo 'Rust route ownership remains preview evidence and does not gate the Go release lane.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        working-directory: apps/api-rust
        run: cargo fmt --all --check

      - name: Lint workspace
        working-directory: apps/api-rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        working-directory: apps/api-rust
        run: cargo test --workspace --all-targets --all-features --locked

  electron-retirement:
    name: Electron embedded-backend retirement guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: electron
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Validate retired package
        run: |
          npm ci --ignore-scripts
          node --check main.js
          bash -n build.sh
          test -x build.sh
          if ./build.sh; then
            echo "::error::Retired Electron packaging unexpectedly succeeded"
            exit 1
          fi
          if npm run build; then
            echo "::error::Retired Electron npm packaging unexpectedly succeeded"
            exit 1
          fi

  docker-publish-config:
    name: Docker publish namespace guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate fork-owned Docker publish namespace
        run: |
          bash check-docker-image-namespace.sh
          bash test-docker-image-namespace.sh
