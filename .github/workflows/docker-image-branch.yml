name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (e.g. alpha, nightly)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.validate.outputs.repository }}
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Require fork-owned Docker repository
        id: validate
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_REPOSITORY}" ]]; then
            echo "::error::DOCKER_IMAGE_REPOSITORY is not configured. Set it to this fork's own Docker Hub repository; it must not be calciumion/new-api."
            exit 1
          fi
          if [[ "${IMAGE_REPOSITORY}" == "calciumion/new-api" ]]; then
            echo "::error::DOCKER_IMAGE_REPOSITORY must not target the upstream calciumion/new-api repository."
            exit 1
          fi
          case "${IMAGE_REPOSITORY}" in
            *[!A-Za-z0-9._/-]*|[[:space:]]*)
              echo "::error::DOCKER_IMAGE_REPOSITORY must be a valid Docker repository name."
              exit 1
              ;;
          esac
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Require complete Rust production parity
        run: |
          set -euo pipefail
          export LC_ALL=C
          bash rust/scripts/check-go-route-manifest.sh
          legacy=rust/routes/legacy-go-routes.tsv
          implemented=rust/routes/rust-implemented-routes.tsv
          ownership=rust/routes/ownership.tsv
          parity_tmp="$(mktemp -d "${RUNNER_TEMP}/lmm-route-parity.XXXXXX")"
          trap 'rm -rf "$parity_tmp"' EXIT

          awk -F '\t' 'NF == 3 { print $1 "\t" $2 }' "$legacy" | sort -u > "$parity_tmp/legacy"
          awk -F '\t' '$0 !~ /^#/ && NF == 3 { print $1 "\t" $2 }' "$implemented" | sort -u > "$parity_tmp/implemented"
          legacy_count="$(wc -l < "$parity_tmp/legacy")"
          implemented_count="$(wc -l < "$parity_tmp/implemented")"
          missing_count="$(comm -23 "$parity_tmp/legacy" "$parity_tmp/implemented" | wc -l)"
          extra_count="$(comm -13 "$parity_tmp/legacy" "$parity_tmp/implemented" | wc -l)"

          if [[ "$legacy_count" -ne 356 || "$implemented_count" -ne 356 ||
                "$missing_count" -ne 0 || "$extra_count" -ne 0 ]]; then
            echo "::error::Docker publish blocked: Rust route coverage is incomplete (implemented=${implemented_count}/356, missing=${missing_count}, extra=${extra_count})"
            exit 1
          fi

          awk -F '\t' '
            FNR == NR {
              if ($0 ~ /^#/ || NF == 0) next
              priority[++rules] = $1 + 0
              kind[rules] = $2
              pattern[rules] = $3
              owner[rules] = $4
              next
            }
            {
              path = $2
              best = -1
              winners = 0
              for (rule = 1; rule <= rules; rule++) {
                applies = (kind[rule] == "exact" && path == pattern[rule]) ||
                          (kind[rule] == "prefix" && index(path, pattern[rule]) == 1)
                if (!applies) continue
                if (priority[rule] > best) {
                  best = priority[rule]
                  winners = 1
                  winner = rule
                } else if (priority[rule] == best) {
                  winners++
                }
              }
              if (winners != 1 || owner[winner] != "rust") failures++
              else rust_owned++
            }
            END {
              if (rust_owned != 356) failures++
              if (failures) print "Docker publish blocked: all 356 routes must be unambiguously Rust-owned" > "/dev/stderr"
              exit failures != 0
            }
          ' "$ownership" "$legacy"
          echo "Docker publish parity gate passed: 356/356 routes are implemented and Rust-owned."

      - name: Resolve Docker tags
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          TAG_PREFIX=${TAG_PREFIX:0:105}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::Branch '$BRANCH_NAME' cannot be converted to a valid Docker tag prefix"
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${SHORT_SHA}"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared Docker tags for $BRANCH_NAME at $SHORT_SHA"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Publishing version: ${{ needs.prepare.outputs.version }} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ needs.prepare.outputs.repository }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            LMM_BUILD_REVISION=${{ needs.prepare.outputs.sha }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ${{ needs.prepare.outputs.repository }}@${{ steps.build.outputs.digest }}

      - name: Output digest
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - branch)
        run: |
          docker buildx imagetools create \
            -t ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }} \
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }}-amd64 \
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }}-arm64

      - name: Create & push manifest (Docker Hub - versioned)
        run: |
          docker buildx imagetools create \
            -t ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }} \
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}-amd64 \
            ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }}
          cosign sign --yes ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }}

      - name: Output manifest digest
        run: |
          echo "### Multi-arch Manifest Digests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.tag_prefix }} >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.version }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
