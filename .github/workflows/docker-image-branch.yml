name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build (for example alpha or nightly)'
        required: true
        type: string
      backend:
        description: 'Backend image to publish'
        required: true
        default: go
        type: choice
        options:
          - go
          - rust-preview

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare branch image tags
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.version.outputs.backend }}
      dockerfile: ${{ steps.version.outputs.dockerfile }}
      image: ${{ steps.version.outputs.image }}
      revision: ${{ steps.version.outputs.revision }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Resolve backend-specific tags
        id: version
        env:
          BACKEND: ${{ inputs.backend }}
          BRANCH_NAME: ${{ inputs.branch }}
          IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_REPOSITORY" || "$IMAGE_REPOSITORY" == "calciumion/new-api" ]]; then
            echo 'DOCKER_IMAGE_REPOSITORY must select this fork owned repository' >&2
            exit 1
          fi
          case "$IMAGE_REPOSITORY" in
            *[!A-Za-z0-9._/-]*|[[:space:]]*)
              echo 'DOCKER_IMAGE_REPOSITORY is invalid' >&2
              exit 1
              ;;
          esac
          base=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          base=${base:0:90}
          base=$(printf '%s' "$base" | sed -E 's/[.-]+$//')
          [[ -n "$base" ]] || { echo "branch cannot form a Docker tag: $BRANCH_NAME" >&2; exit 1; }

          revision=$(git rev-parse HEAD)
          short_revision=$(git rev-parse --short HEAD)
          case "$BACKEND" in
            go)
              image=$IMAGE_REPOSITORY
              dockerfile=Dockerfile
              tag_prefix=$base
              version="${base}-$(date +'%Y%m%d')-${short_revision}"
              ;;
            rust-preview)
              image=${IMAGE_REPOSITORY}-rust-preview
              dockerfile=Dockerfile.rust
              tag_prefix=${base}-preview
              version="${base}-$(date +'%Y%m%d')-${short_revision}-preview"
              ;;
            *)
              echo "unsupported backend: $BACKEND" >&2
              exit 1
              ;;
          esac
          if [[ ! -f "$dockerfile" ]]; then
            echo "error: selected dockerfile '$dockerfile' does not exist in this branch." >&2
            echo "restore or replace the Dockerfile path before running this workflow." >&2
            exit 1
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$tag_prefix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-single-arch:
    name: Build ${{ needs.prepare.outputs.backend }} (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Write VERSION
        run: printf '%s\n' '${{ needs.prepare.outputs.version }}' > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build and push single-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ needs.prepare.outputs.dockerfile }}
          build-args: |
            LMM_BUILD_REVISION=${{ needs.prepare.outputs.revision }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        run: cosign sign --yes '${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}'

  create-manifests:
    name: Publish ${{ needs.prepare.outputs.backend }} branch manifests
    needs: [prepare, build-single-arch]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create branch manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag_prefix }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

      - name: Create versioned manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign branch manifests
        run: |
          cosign sign --yes '${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag_prefix }}'
          cosign sign --yes '${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}'
