name: Publish Docker image (multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (for example v0.10.8)'
        required: true
        type: string
      backend:
        description: 'Backend image to publish'
        required: true
        default: go
        type: choice
        options:
          - go
          - rust-preview

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve backend and Docker tags
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.release.outputs.backend }}
      dockerfile: ${{ steps.release.outputs.dockerfile }}
      image: ${{ steps.release.outputs.image }}
      latest: ${{ steps.release.outputs.latest }}
      revision: ${{ steps.release.outputs.revision }}
      source_tag: ${{ steps.release.outputs.source_tag }}
      version_tag: ${{ steps.release.outputs.version_tag }}
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release configuration
        id: release
        env:
          REQUESTED_BACKEND: ${{ inputs.backend || 'go' }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            git rev-parse "refs/tags/$REQUESTED_TAG" >/dev/null
            source_tag="$REQUESTED_TAG"
          else
            source_tag=${GITHUB_REF#refs/tags/}
          fi
          docker_tag=$(printf '%s' "$source_tag" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          [[ -n "$docker_tag" ]] || { echo 'release tag cannot form a Docker tag' >&2; exit 1; }

          case "$REQUESTED_BACKEND" in
            go)
              image=calciumion/new-api
              dockerfile=Dockerfile
              version_tag=$docker_tag
              latest=true
              ;;
            rust-preview)
              image=calciumion/new-api-rust-preview
              dockerfile=Dockerfile.rust
              version_tag=${docker_tag}-preview
              latest=false
              ;;
            *)
              echo "unsupported backend: $REQUESTED_BACKEND" >&2
              exit 1
              ;;
          esac

          revision=$(git rev-parse HEAD)
          printf '%s\n' "$source_tag" > VERSION
          echo "backend=$REQUESTED_BACKEND" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

  build-single-arch:
    name: Build ${{ needs.prepare.outputs.backend }} (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Write VERSION
        run: printf '%s\n' '${{ needs.prepare.outputs.source_tag }}' > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve architecture tags
        id: tags
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.latest }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION_TAG}-${ARCH}"
            if [[ "$PUBLISH_LATEST" == true ]]; then
              echo "${IMAGE}:latest-${ARCH}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ needs.prepare.outputs.dockerfile }}
          build-args: |
            LMM_BUILD_REVISION=${{ needs.prepare.outputs.revision }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        run: cosign sign --yes '${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}'

  create-manifests:
    name: Publish ${{ needs.prepare.outputs.backend }} multi-arch manifest
    needs: [prepare, build-single-arch]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create versioned multi-arch manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION_TAG}" \
            "${IMAGE}:${VERSION_TAG}-amd64" \
            "${IMAGE}:${VERSION_TAG}-arm64"

      - name: Create Go latest manifest
        if: needs.prepare.outputs.latest == 'true'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign versioned manifest
        run: cosign sign --yes '${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version_tag }}'

      - name: Sign Go latest manifest
        if: needs.prepare.outputs.latest == 'true'
        run: cosign sign --yes '${{ needs.prepare.outputs.image }}:latest'
