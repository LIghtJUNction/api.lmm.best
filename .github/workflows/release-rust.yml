name: Release lmm-api-rs

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#cli-v}
          [[ $GITHUB_REF_NAME == "cli-v${version}" ]]
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          workspace_version=$(cargo metadata \
            --manifest-path apps/api-rust/Cargo.toml \
            --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "lmm-api-rs") | .version')
          test "$workspace_version" = "$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - name: Require completed commit checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-commit-checks.sh "$GITHUB_SHA"

      - name: Set up pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Verify CLI dispatch and warnings
        working-directory: apps/api-rust
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --locked --bin lmm-api-rs bootstrap_cli
          cargo clippy --locked --bin lmm-api-rs --tests -- -D warnings

  build:
    name: Build / ${{ matrix.asset_platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_platform: linux-amd64
            executable_suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_platform: linux-arm64
            executable_suffix: ""
          - runner: macos-15-large
            target: x86_64-apple-darwin
            asset_platform: darwin-amd64
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_platform: darwin-arm64
            executable_suffix: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset_platform: windows-amd64
            executable_suffix: ".exe"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_platform: windows-arm64
            executable_suffix: ".exe"
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
          rustc --version

      - name: Build release binaries
        working-directory: apps/api-rust
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" \
            --bin lmm-api-rs --bin lmm-db-migrate

      - name: Exercise bootstrap CLI without server dependencies
        working-directory: apps/api-rust
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/lmm-api-rs${{ matrix.executable_suffix }}"
          test -f "$binary"
          "$binary" --version
          "$binary" doctor --json > "$RUNNER_TEMP/lmm-api-rs-doctor.json"
          grep -F '"platform"' "$RUNNER_TEMP/lmm-api-rs-doctor.json" >/dev/null

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#cli-v}
          artifact="lmm-api-rs-${version}-${{ matrix.asset_platform }}"
          bundle="release-rust/${artifact}"
          mkdir -p "$bundle"
          cp "apps/api-rust/target/${{ matrix.target }}/release/lmm-api-rs${{ matrix.executable_suffix }}" \
            "$bundle/lmm-api-rs${{ matrix.executable_suffix }}"
          cp "apps/api-rust/target/${{ matrix.target }}/release/lmm-db-migrate${{ matrix.executable_suffix }}" \
            "$bundle/lmm-db-migrate${{ matrix.executable_suffix }}"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          tar -czf "release-rust/${artifact}.tar.gz" -C release-rust "$artifact"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and checksum archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#cli-v}
          archive="lmm-api-rs-${version}-${{ matrix.asset_platform }}.tar.gz"
          cd release-rust
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$digest" "$archive" > "$archive.sha256"
          cosign sign-blob --yes \
            --bundle "$archive.sigstore.json" \
            "$archive"

      - name: Upload signed platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmm-api-rs-${{ matrix.asset_platform }}
          path: |
            release-rust/*.tar.gz
            release-rust/*.tar.gz.sha256
            release-rust/*.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmm-api-rs-*
          merge-multiple: true
          path: release-rust

      - name: Validate complete platform set
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#cli-v}
          for platform in \
            linux-amd64 linux-arm64 \
            darwin-amd64 darwin-arm64 \
            windows-amd64 windows-arm64
          do
            base="release-rust/lmm-api-rs-${version}-${platform}.tar.gz"
            test -f "$base"
            test -f "$base.sha256"
            test -f "$base.sigstore.json"
          done
          test "$(find release-rust -maxdepth 1 -type f | wc -l)" -eq 18

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#cli-v}
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "lmm-api-rs ${version}" \
            --notes "Cross-platform lmm-api-rs client/server release. Installing these assets does not change the lmm-api backend-selection symlink." \
            release-rust/*
