name: Go and web release bundle

on:
  push:
    tags:
      - '*'
      - '!*-alpha*'
  workflow_dispatch:
    inputs:
      include_rust_preview:
        description: 'Also build and sign optional Rust preview artifacts'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  prepare:
    name: Resolve immutable release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve release version
        id: identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            raw_version=$GITHUB_REF_NAME
          else
            raw_version="0.1.0-${GITHUB_SHA:0:12}"
          fi
          version=$(printf '%s' "$raw_version" | sed -E 's/[^A-Za-z0-9._+-]+/-/g')
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    name: Build and sign web artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared web frontend
        env:
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run --filter @lmm/web build

      - name: Package web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-web
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" -C apps/web dist
          sha256sum "$archive" > "${archive}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload signed web release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: release-web/*
          if-no-files-found: error

      - name: Upload web assets for Go builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-web-dist
          path: apps/web/dist
          if-no-files-found: error

  go-test:
    name: Test Go default backend and independent relaykit
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-web-dist
          path: release-web-download

      - name: Synchronize web assets into Go embed tree
        run: |
          rm -rf apps/api-go/web/dist
          mkdir -p apps/api-go/web/dist
          cp -a release-web-download/. apps/api-go/web/dist/
          test -f apps/api-go/web/dist/index.html

      - name: Test default Go module
        working-directory: apps/api-go
        run: go test ./...

      - name: Test and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go test ./...
          go build ./...

  go-build:
    name: Build and sign Go linux/${{ matrix.arch }} artifact
    needs: [prepare, web, go-test]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-web-dist
          path: release-web-download

      - name: Build static Go binary and package artifact
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf apps/api-go/web/dist
          mkdir -p apps/api-go/web/dist
          cp -a release-web-download/. apps/api-go/web/dist/

          artifact="lmm-api-go-${RELEASE_VERSION}-linux-${GOARCH}"
          bundle="release-go/${artifact}"
          mkdir -p "$bundle"
          (
            cd apps/api-go
            go build -trimpath \
              -ldflags="-s -w -X github.com/QuantumNous/new-api/common.Version=${RELEASE_VERSION}" \
              -o "../../${bundle}/lmm-api" .
          )
          file "$bundle/lmm-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' '${{ github.sha }}' > "$bundle/REVISION"
          tar -czf "release-go/${artifact}.tar.gz" -C release-go "$artifact"
          sha256sum "release-go/${artifact}.tar.gz" > "release-go/${artifact}.tar.gz.sha256"
          rm -rf "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Go artifact
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-go/lmm-api-go-${RELEASE_VERSION}-linux-${ARCH}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Go artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-go-linux-${{ matrix.arch }}
          path: release-go/*
          if-no-files-found: error

  rust-preview:
    name: Build and sign optional Rust preview artifact
    if: github.event_name == 'workflow_dispatch' && inputs.include_rust_preview
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify Rust preview health
        working-directory: apps/api-rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Build and package Rust preview binaries
        env:
          LMM_BUILD_REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --manifest-path apps/api-rust/Cargo.toml --release --locked \
            --package lmm-api-rs --package lmm-db-migrate
          artifact="lmm-api-rust-preview-${RELEASE_VERSION}-linux-amd64"
          bundle="release-rust-preview/${artifact}"
          mkdir -p "$bundle"
          cp apps/api-rust/target/release/lmm-api-rs "$bundle/"
          cp apps/api-rust/target/release/lmm-db-migrate "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' '${{ github.sha }}' > "$bundle/REVISION"
          tar -czf "release-rust-preview/${artifact}.tar.gz" -C release-rust-preview "$artifact"
          sha256sum "release-rust-preview/${artifact}.tar.gz" > "release-rust-preview/${artifact}.tar.gz.sha256"
          rm -rf "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Rust preview artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-rust-preview/lmm-api-rust-preview-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Rust preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rust-preview-linux-amd64
          path: release-rust-preview/*
          if-no-files-found: error

  publish:
    name: Publish signed release assets
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      always() &&
      needs.web.result == 'success' &&
      needs.go-build.result == 'success' &&
      (needs.rust-preview.result == 'skipped' || needs.rust-preview.result == 'success')
    needs: [prepare, web, go-build, rust-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish Go and web artifacts with optional Rust preview
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
