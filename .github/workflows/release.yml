name: LMM API release bundles

on:
  push:
    tags:
      - '*'
      - '!*-alpha*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  prepare:
    name: Resolve immutable release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve release version
        id: identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            raw_version=$GITHUB_REF_NAME
            raw_version=${raw_version#v}
          else
            raw_version="0.1.0-${GITHUB_SHA:0:12}"
          fi
          version=$(printf '%s' "$raw_version" | sed -E 's/[^A-Za-z0-9._+-]+/-/g')
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    name: Build and sign web artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared web frontend
        env:
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run --filter @lmm/web build

      - name: Package web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-web
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" -C apps/web dist
          (cd release-web && sha256sum "${archive##*/}" > "${archive##*/}.sha256")

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload signed web release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: release-web/*
          if-no-files-found: error

  core:
    name: Package and sign shared core artifact
    needs: [prepare, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web
          path: release-web

      - name: Package shared launcher, configuration, and frontend
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact="lmm-api-core-${RELEASE_VERSION}"
          bundle="release-core/${artifact}"
          mkdir -p "$bundle/frontend-dist"
          tar -xzf "release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz" \
            -C "$bundle/frontend-dist" --strip-components=1
          cp packaging/common/lmm-api/lmm-api-launcher "$bundle/"
          cp packaging/common/lmm-api/lmm-api-select "$bundle/"
          cp packaging/common/lmm-api/lmm-api.service "$bundle/"
          cp packaging/common/lmm-api/backend.conf "$bundle/"
          cp packaging/common/lmm-api/lmm-api.env "$bundle/"
          cp packaging/common/lmm-api/lmm-api-rs.env.example "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' '${{ github.sha }}' > "$bundle/REVISION"
          tar -czf "release-core/${artifact}.tar.gz" -C release-core "$artifact"
          (cd release-core && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")
          rm -rf "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign core artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-core/lmm-api-core-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload core artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core
          path: release-core/*
          if-no-files-found: error

  go-test:
    name: Test Go default backend and independent relaykit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Test default Go module
        working-directory: apps/api-go
        run: go test ./...

      - name: Test and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go test ./...
          go build ./...

  go-build:
    name: Build and sign Go linux/${{ matrix.arch }} artifact
    needs: [prepare, go-test]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Build static Go binary and package artifact
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact="lmm-api-go-${RELEASE_VERSION}-linux-${GOARCH}"
          bundle="release-go/${artifact}"
          mkdir -p "$bundle"
          (
            cd apps/api-go
            go build -trimpath \
              -ldflags="-s -w -X github.com/QuantumNous/new-api/common.Version=${RELEASE_VERSION}" \
              -o "../../${bundle}/lmm-api" .
          )
          file "$bundle/lmm-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' '${{ github.sha }}' > "$bundle/REVISION"
          tar -czf "release-go/${artifact}.tar.gz" -C release-go "$artifact"
          (cd release-go && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")
          rm -rf "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Go artifact
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-go/lmm-api-go-${RELEASE_VERSION}-linux-${ARCH}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Go artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-go-linux-${{ matrix.arch }}
          path: release-go/*
          if-no-files-found: error

  rust:
    name: Build and sign Rust linux/amd64 artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Install route coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify Rust preview health
        working-directory: apps/api-rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Build and package Rust preview binaries
        env:
          LMM_BUILD_REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --manifest-path apps/api-rust/Cargo.toml --release --locked \
            --package lmm-api-rs --package lmm-db-migrate
          artifact="lmm-api-rs-${RELEASE_VERSION}-linux-amd64"
          bundle="release-rust/${artifact}"
          mkdir -p "$bundle"
          cp apps/api-rust/target/release/lmm-api-rs "$bundle/"
          cp apps/api-rust/target/release/lmm-db-migrate "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' '${{ github.sha }}' > "$bundle/REVISION"
          tar -czf "release-rust/${artifact}.tar.gz" -C release-rust "$artifact"
          (cd release-rust && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")
          rm -rf "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Rust preview artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-rust/lmm-api-rs-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Rust artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rust-linux-amd64
          path: release-rust/*
          if-no-files-found: error

  publish:
    name: Publish signed release assets
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      always() &&
      needs.web.result == 'success' &&
      needs.core.result == 'success' &&
      needs.go-build.result == 'success' &&
      needs.rust.result == 'success'
    needs: [prepare, web, core, go-build, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish core, backend, and web artifacts
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
