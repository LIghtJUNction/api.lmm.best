# The application owns the allowlist decision; this file owns the regional
# ingress gate and the user-facing HTTP 451 response. It is included inside
# the api.lmm.best TLS server block.

location = /__lmm_cn_access_ip {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/api/internal/access-ip-policy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-LMM-CN-Source $lmm_cn_source;
    proxy_set_header X-Original-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Non-CN requests receive 204 from the policy endpoint. CN requests require a
# valid L2+ account whose single personal IP matches the current source IP.
auth_request /__lmm_cn_access_ip;
error_page 401 403 404 = @lmm_cn_region_notice;

location @lmm_cn_region_notice {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 451 "Service unavailable in this region.\n";
}
