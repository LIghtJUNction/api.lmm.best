# Include in the existing TLS server block. These exact loopback GET/HEAD locations are
# the only Rust-owned routes until business-route parity and PG migration gates pass.
location = /_internal/rust/livez {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    limit_except GET { deny all; }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://lmm_api_rs_active/livez;
}

